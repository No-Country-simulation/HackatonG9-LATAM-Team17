<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Analysis & Simulation API - Oracle + Alura</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #0066cc; text-align: center; font-size: 24px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; height: 250px; font-family: monospace; font-size: 13px; }
        button { background-color: #0066cc; color: white; border: none; padding: 12px; width: 100%; margin-top: 15px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button.simular { background-color: #28a745; }
        button:hover { opacity: 0.9; }
        .result { margin-top: 25px; background: #eef9ff; padding: 20px; border-left: 5px solid #0066cc; border-radius: 4px; display: none; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>

<div class="container">
    <h1>Financial Analysis API</h1>
    <p style="text-align: center; color: #666;">Hackathon Oracle + Alura</p>

    <label for="json_transacciones">Payload JSON para Análisis y Simulación:</label>
    <textarea id="json_transacciones">{
  "ingreso_mensual": 4500,
  "deuda_total": 1200,
  "objetivo_presupuesto": 500,
  "pago_prestamo": 300,
  "servicios_suscripcion": 50,
  "fondo_emergencia": 1000,
  "monto_inversion": 200,
  "meta_ahorro": 5000,
  "transacciones": [
    {
      "descripcion": "Salario",
      "valor": 4500,
      "categoria": "Ingresos"
    },
    {
      "descripcion": "Supermercado",
      "valor": 420,
      "categoria": "Alimentos"
    },
    {
      "descripcion": "Combustible",
      "valor": 300,
      "categoria": "Transporte"
    },
    {
      "descripcion": "Streaming",
      "valor": 40,
      "categoria": "Entretenimiento"
    }
  ]
}</textarea>

    <button onclick="enviarPeticion('/analisis-financiero')">Enviar Análisis Financiero</button>
    <button class="simular" onclick="enviarPeticion('/simular-ahorro')">Simular Meta de Ahorro</button>

    <div class="result" id="resultadoBox">
        <h3>Resultado:</h3>
        <pre id="resultadoJSON"></pre>
    </div>
</div>

<script>
async function enviarPeticion(endpoint) {
    const jsonText = document.getElementById('json_transacciones').value;
    const resultadoBox = document.getElementById('resultadoBox');
    const resultadoJSON = document.getElementById('resultadoJSON');

    try {
        const cuerpoData = JSON.parse(jsonText);

        const response = await fetch(`http://127.0.0.1:8000${endpoint}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(cuerpoData)
        });

        if (!response.ok) {
            throw new Error(`Error en el servidor: ${response.statusText}`);
        }

        const data = await response.json();
        resultadoJSON.textContent = JSON.stringify(data, null, 2);
        resultadoBox.style.display = 'block';
    } catch (error) {
        alert('Error: Revisa que el JSON sea válido o que tu backend en FastAPI esté corriendo.\n\nDetalles: ' + error.message);
    }
}
</script>

</body>
</html>
